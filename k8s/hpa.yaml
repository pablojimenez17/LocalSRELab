apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: localsre-api-hpa
  namespace: localsre
  labels:
    app.kubernetes.io/name: localsre-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: localsre-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
