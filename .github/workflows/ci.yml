name: LocalSRE CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      - name: Lint with Flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat warnings as non-fatal or strict
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite
        run: |
          python -m pytest app/tests -v

  docker-build-and-scan:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: localsre-api:ci-${{ github.sha }}
          load: true

      - name: Scan Image with Trivy for CVEs
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: localsre-api:ci-${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  k8s-manifest-validation:
    name: Kubernetes Manifests Dry-Run Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kubectl & Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Validate Kustomize Build
        run: |
          kubectl kustomize k8s/ > compiled-manifests.yaml
          echo "Kustomize successfully compiled $(grep -c 'apiVersion:' compiled-manifests.yaml) Kubernetes resources."

      - name: Schema Validation with Kubeconform
        uses: yannh/kubeconform-action@v0.3.2
        with:
          k8s-version: 'v1.30.0'
          files: 'compiled-manifests.yaml'
