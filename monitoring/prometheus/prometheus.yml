global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "localsre-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "localhost:8000", "host.docker.internal:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
